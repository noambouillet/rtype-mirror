name: R-Type Build CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar libx11-dev libxi-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Create vcpkg archives directory
        run: mkdir -p ${{ github.workspace }}/.vcpkg-archives

      - name: Set up Vcpkg Binary Cache
        run: echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-archives,readwrite" >> $GITHUB_ENV

      - name: Cache Vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-archives
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap Vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build Project
        run: cmake --build build