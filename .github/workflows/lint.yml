name: lint
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies and tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libudev-dev

      - name: clang-format
        run: |
          if [ -n "$(git ls-files -- '*.cpp' '*.hpp')" ]; then
            git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror
          else
            echo 'No C++ files to format.'
          fi

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up Vcpkg Binary Cache
        run: echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

      - name: Bootstrap Vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Generate compile_commands.json
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          if [ -n "$(git ls-files -- 'src/*.cpp')" ]; then
            run-clang-tidy -p build -quiet 'src/.*\.cpp'
          else
            echo 'No C++ sources to analyze.'
          fi
