name: lint
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies and tools
        run: sudo apt-get update && sudo apt-get install -y python3-venv

      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/python" -m pip install --disable-pip-version-check "clang-format==$(cat .clang-format-version)"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: clang-format
        run: |
          clang-format --version
          if [ -n "$(git ls-files -- '*.cpp' '*.hpp')" ]; then
            git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror
          else
            echo 'No C++ files to format.'
          fi
